# Builds the worker images and pushes them to this repository's GitHub container registry (private, like the
# repository). Runs on every push to the deployed branch that changes worker code (worker hosts with the auto-updater
# pick the new images up within 15 minutes), and by hand (Actions → Worker images → Run workflow).
name: Worker images

on:
  push:
    branches: [claude/practical-davinci-r0wfap]
    paths:
      - "services/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      engineering:
        description: Also build the KiCad engineering worker (slow, ~5 GB)
        type: boolean
        default: true

# A newer push replaces a build still running for an older one.
concurrency:
  group: worker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Names
        run: |
          echo "PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - name: Worker
        run: |
          docker build -f services/orchestrator/Dockerfile -t "$PREFIX/vx-worker:$TAG" -t "$PREFIX/vx-worker:latest" .
          docker push --all-tags "$PREFIX/vx-worker"
      - name: Engineering worker
        if: github.event_name == 'push' || inputs.engineering
        run: |
          IMAGE=vx-engineering:g0 ./services/engineering/build.sh
          docker build -f services/engineering/Dockerfile.worker --build-arg ENGINEERING_IMAGE=vx-engineering:g0 \
            -t "$PREFIX/vx-engineering-worker:$TAG" -t "$PREFIX/vx-engineering-worker:latest" .
          docker push --all-tags "$PREFIX/vx-engineering-worker"
      - name: Summary
        run: |
          echo "Pushed $PREFIX/vx-worker:$TAG$([ '${{ github.event_name }}' = push ] || [ '${{ inputs.engineering }}' = true ] && echo " and $PREFIX/vx-engineering-worker:$TAG")." >> "$GITHUB_STEP_SUMMARY"
          echo "On the worker host: VX_IMAGE_PREFIX=$PREFIX VX_IMAGE_TAG=$TAG docker compose -f deploy/docker-compose.yml up -d" >> "$GITHUB_STEP_SUMMARY"
